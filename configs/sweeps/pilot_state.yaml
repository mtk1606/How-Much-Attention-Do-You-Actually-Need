# Stage 4 pilot, state tracking: parity (Z2) and S3 composition, trained at L=64, tested at 64/128/256.
# gdn_neg (beta in (0,2)) is the arm that the literature predicts can solve parity (verification L18).
name: pilot_state
base:
  task: state
  model: {family: gdn, vocab_size: 16, d_model: 64, n_layers: 8, n_attn: 0, placement: block_end, attn_heads: 4, gdn_heads: 4, mamba_head_dim: 8, mamba_d_state: 16, chunk: 32}
  train:
    - {seq_len: 64, difficulty: {group: parity}}
  eval:
    - {seq_len: 64, difficulty: {group: parity}}
    - {seq_len: 128, difficulty: {group: parity}}
    - {seq_len: 256, difficulty: {group: parity}}
  steps: 2000
  batch_size: 32
  lr: 1.0e-3
  eval_every: 500
  n_eval: 256
  n_val: 128
grid:
  model.family: [mamba2, gdn, gdn_neg]
  model.n_attn: [0, 4, 8]
  lr: [1.0e-3, 3.0e-3]
