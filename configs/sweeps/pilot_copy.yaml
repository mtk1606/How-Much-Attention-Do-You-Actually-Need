# Stage 4 pilot, copying: spans of 8/16/24 tokens from a 32-token vocabulary, L=80.
name: pilot_copy
base:
  task: copy
  model: {family: gdn, vocab_size: 64, d_model: 64, n_layers: 8, n_attn: 0, placement: block_end, attn_heads: 4, gdn_heads: 4, mamba_head_dim: 8, mamba_d_state: 16, chunk: 32}
  train:
    - {seq_len: 80, difficulty: {span_length: 8, vocab: 32}}
    - {seq_len: 80, difficulty: {span_length: 16, vocab: 32}}
    - {seq_len: 80, difficulty: {span_length: 24, vocab: 32}}
  eval:
    - {seq_len: 80, difficulty: {span_length: 8, vocab: 32}}
    - {seq_len: 80, difficulty: {span_length: 16, vocab: 32}}
    - {seq_len: 80, difficulty: {span_length: 24, vocab: 32}}
  steps: 2000
  batch_size: 32
  lr: 1.0e-3
  eval_every: 500
  n_eval: 256
  n_val: 128
grid:
  model.family: [mamba2, gdn]
  model.n_attn: [0, 4, 8]
  lr: [1.0e-3, 3.0e-3]
