# Stage 4 pilot, state tracking (parity), 4 layers, per-architecture LR grid (lessons from log entry 06).
# Train at L = 64, test at 64 (in distribution), 128 and 256 (length generalisation).
# gdn_neg (beta in (0, 2)) is the arm the literature predicts can solve parity (verification L18).
name: pilot_state_v4
base:
  task: state
  model: {family: gdn, vocab_size: 16, d_model: 64, n_layers: 4, n_attn: 0, placement: block_end, attn_heads: 2, gdn_heads: 4, mamba_head_dim: 8, mamba_d_state: 16, chunk: 32}
  train:
    - {seq_len: 64, difficulty: {group: parity}}
  eval:
    - {seq_len: 64, difficulty: {group: parity}}
    - {seq_len: 128, difficulty: {group: parity}}
    - {seq_len: 256, difficulty: {group: parity}}
  steps: 2000
  batch_size: 64
  lr: 1.0e-3
  eval_every: 500
  n_eval: 256
  n_val: 128
grid:
  model.family: [mamba2, gdn, gdn_neg]
  model.n_attn: [0, 2, 4]
  lr: [1.0e-3, 3.0e-3, 1.0e-2, 3.0e-2]
