# Parity pilot LR extension: pure attention, pure Mamba-2 and the r = 1/2 Mamba-2 hybrid selected 1e-3, the lower
# edge of the grid (headline gate failed). Same tag, so selection considers all six LRs for these cells.
name: pilot_state_v4
base:
  task: state
  model: {family: mamba2, vocab_size: 16, d_model: 64, n_layers: 4, n_attn: 0, placement: block_end, attn_heads: 2, gdn_heads: 4, mamba_head_dim: 8, mamba_d_state: 16, chunk: 32}
  train:
    - {seq_len: 64, difficulty: {group: parity}}
  eval:
    - {seq_len: 64, difficulty: {group: parity}}
    - {seq_len: 128, difficulty: {group: parity}}
    - {seq_len: 256, difficulty: {group: parity}}
  steps: 2000
  batch_size: 64
  lr: 1.0e-4
  eval_every: 500
  n_eval: 256
  n_val: 128
grid:
  model.n_attn: [0, 2, 4]
  lr: [1.0e-4, 3.0e-4]
