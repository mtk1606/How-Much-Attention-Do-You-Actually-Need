# Stage 4 pilot v4: v3 data at depth 4. Pure attention at depth 8 stayed on the MQAR plateau with mixed
# pair counts within the CPU budget; depth 4 learned (research log entry 05). Ratios 0, 1/2, 1 = 0, 2, 4 of 4.
name: pilot_mqar_v4
base:
  task: mqar
  model: {family: gdn, vocab_size: 144, d_model: 64, n_layers: 4, n_attn: 0, placement: block_end, attn_heads: 2, gdn_heads: 4, mamba_head_dim: 8, mamba_d_state: 16, chunk: 32}
  train:
    - {seq_len: 32, difficulty: {num_pairs: 2, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 32, difficulty: {num_pairs: 4, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 32, difficulty: {num_pairs: 6, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 32, difficulty: {num_pairs: 8, key_vocab: 64, value_vocab: 64}}
  eval:
    - {seq_len: 32, difficulty: {num_pairs: 2, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 32, difficulty: {num_pairs: 4, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 32, difficulty: {num_pairs: 6, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 32, difficulty: {num_pairs: 8, key_vocab: 64, value_vocab: 64}}
  steps: 3000
  batch_size: 64
  lr: 1.0e-3
  eval_every: 500
  n_eval: 512
  n_val: 256
grid:
  model.family: [mamba2, gdn]
  model.n_attn: [0, 2, 4]
  lr: [1.0e-3, 3.0e-3]
