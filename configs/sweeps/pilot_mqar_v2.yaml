# Stage 4 pilot v2 (replaces pilot_mqar after its attention-only runs stayed on the 1/P plateau for
# 2,000 steps; see research/experiment_log/2026-09-30_03). Shorter sequences, smaller key space, easier
# pair counts, larger batch: closer to the setting a 2-layer attention model solved in 500 steps.
name: pilot_mqar_v2
base:
  task: mqar
  model: {family: gdn, vocab_size: 144, d_model: 64, n_layers: 8, n_attn: 0, placement: block_end, attn_heads: 4, gdn_heads: 4, mamba_head_dim: 8, mamba_d_state: 16, chunk: 32}
  train:
    - {seq_len: 64, difficulty: {num_pairs: 2, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 64, difficulty: {num_pairs: 4, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 64, difficulty: {num_pairs: 8, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 64, difficulty: {num_pairs: 16, key_vocab: 64, value_vocab: 64}}
  eval:
    - {seq_len: 64, difficulty: {num_pairs: 2, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 64, difficulty: {num_pairs: 4, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 64, difficulty: {num_pairs: 8, key_vocab: 64, value_vocab: 64}}
    - {seq_len: 64, difficulty: {num_pairs: 16, key_vocab: 64, value_vocab: 64}}
  steps: 4000
  batch_size: 64
  lr: 1.0e-3
  eval_every: 500
  n_eval: 512
  n_val: 256
grid:
  model.family: [mamba2, gdn]
  model.n_attn: [0, 4, 8]
  lr: [1.0e-3, 3.0e-3]
