# Stage 4 pilot: ratios {0, 1/2, 1} x {Mamba-2, Gated DeltaNet} on MQAR, two learning rates, one seed.
# Purpose: check that the probe separates architectures at this scale and calibrate difficulty.
name: pilot_mqar
base:
  task: mqar
  model: {family: gdn, vocab_size: 272, d_model: 64, n_layers: 8, n_attn: 0, placement: block_end, attn_heads: 4, gdn_heads: 4, mamba_head_dim: 8, mamba_d_state: 16, chunk: 32}
  train:
    - {seq_len: 128, difficulty: {num_pairs: 4, key_vocab: 128, value_vocab: 128}}
    - {seq_len: 128, difficulty: {num_pairs: 8, key_vocab: 128, value_vocab: 128}}
    - {seq_len: 128, difficulty: {num_pairs: 16, key_vocab: 128, value_vocab: 128}}
    - {seq_len: 128, difficulty: {num_pairs: 24, key_vocab: 128, value_vocab: 128}}
  eval:
    - {seq_len: 128, difficulty: {num_pairs: 4, key_vocab: 128, value_vocab: 128}}
    - {seq_len: 128, difficulty: {num_pairs: 8, key_vocab: 128, value_vocab: 128}}
    - {seq_len: 128, difficulty: {num_pairs: 16, key_vocab: 128, value_vocab: 128}}
    - {seq_len: 128, difficulty: {num_pairs: 24, key_vocab: 128, value_vocab: 128}}
    - {seq_len: 128, difficulty: {num_pairs: 32, key_vocab: 128, value_vocab: 128}}
  steps: 3000
  batch_size: 32
  lr: 1.0e-3
  eval_every: 500
  n_eval: 512
  n_val: 256
grid:
  model.family: [mamba2, gdn]
  model.n_attn: [0, 4, 8]
  lr: [1.0e-3, 3.0e-3]
