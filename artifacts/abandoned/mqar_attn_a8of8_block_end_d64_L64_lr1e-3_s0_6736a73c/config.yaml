task: mqar
model:
  family: mamba2
  vocab_size: 144
  d_model: 64
  n_layers: 8
  n_attn: 8
  placement: block_end
  attn_heads: 4
  mlp_ratio: 2.0
  mamba_head_dim: 8
  mamba_d_state: 16
  gdn_heads: 4
  d_conv: 4
  chunk: 32
  extra: {}
  attention_ratio: 1.0
train:
- seq_len: 64
  difficulty:
    num_pairs: 2
    key_vocab: 64
    value_vocab: 64
- seq_len: 64
  difficulty:
    num_pairs: 4
    key_vocab: 64
    value_vocab: 64
- seq_len: 64
  difficulty:
    num_pairs: 8
    key_vocab: 64
    value_vocab: 64
- seq_len: 64
  difficulty:
    num_pairs: 16
    key_vocab: 64
    value_vocab: 64
eval:
- seq_len: 64
  difficulty:
    num_pairs: 2
    key_vocab: 64
    value_vocab: 64
- seq_len: 64
  difficulty:
    num_pairs: 4
    key_vocab: 64
    value_vocab: 64
- seq_len: 64
  difficulty:
    num_pairs: 8
    key_vocab: 64
    value_vocab: 64
- seq_len: 64
  difficulty:
    num_pairs: 16
    key_vocab: 64
    value_vocab: 64
steps: 4000
batch_size: 64
lr: 0.001
weight_decay: 0.1
warmup_frac: 0.05
grad_clip: 1.0
seed: 0
eval_every: 500
n_eval: 512
n_val: 256
precision: fp32
save_checkpoint: true
tags:
- pilot_mqar_v2
