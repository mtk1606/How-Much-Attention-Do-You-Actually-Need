task: mqar
model:
  family: mamba2
  vocab_size: 272
  d_model: 64
  n_layers: 8
  n_attn: 0
  placement: block_end
  attn_heads: 4
  mlp_ratio: 2.0
  mamba_head_dim: 8
  mamba_d_state: 16
  gdn_heads: 4
  d_conv: 4
  chunk: 32
  extra: {}
  attention_ratio: 0.0
train:
- seq_len: 128
  difficulty:
    num_pairs: 4
    key_vocab: 128
    value_vocab: 128
- seq_len: 128
  difficulty:
    num_pairs: 8
    key_vocab: 128
    value_vocab: 128
- seq_len: 128
  difficulty:
    num_pairs: 16
    key_vocab: 128
    value_vocab: 128
- seq_len: 128
  difficulty:
    num_pairs: 24
    key_vocab: 128
    value_vocab: 128
eval:
- seq_len: 128
  difficulty:
    num_pairs: 4
    key_vocab: 128
    value_vocab: 128
- seq_len: 128
  difficulty:
    num_pairs: 8
    key_vocab: 128
    value_vocab: 128
- seq_len: 128
  difficulty:
    num_pairs: 16
    key_vocab: 128
    value_vocab: 128
- seq_len: 128
  difficulty:
    num_pairs: 24
    key_vocab: 128
    value_vocab: 128
- seq_len: 128
  difficulty:
    num_pairs: 32
    key_vocab: 128
    value_vocab: 128
steps: 3000
batch_size: 32
lr: 0.001
weight_decay: 0.1
warmup_frac: 0.05
grad_clip: 1.0
seed: 0
eval_every: 500
n_eval: 512
n_val: 256
precision: fp32
save_checkpoint: true
tags:
- pilot_mqar
