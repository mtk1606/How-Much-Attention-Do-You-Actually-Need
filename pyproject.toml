[project]
name = "attnratio"
version = "0.1.0"
description = "How much attention does a hybrid sequence model need, per capability? Controlled attention-ratio sweeps on mechanistic probes."
authors = [{ name = "Mohamed El Khoudimi" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "torch>=2.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "einops>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
attnratio = "attnratio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741"]
